name: LLMOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DO_TOKEN: ${{ secrets.DO_TOKEN }}
      TRIVY_SEVERITY: HIGH,CRITICAL

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t $DOCKER_USERNAME/gpt-hf:latest .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_USERNAME }}/gpt-hf:latest
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          vuln-type: os,library
          format: table
        continue-on-error: true

      - name: Clean Trivy cache
        run: |
          echo "Cleaning Trivy cache..."
          rm -rf $HOME/.cache/trivy

      - name: Push Docker image
        run: docker push $DOCKER_USERNAME/gpt-hf:latest

      # Install doctl and authenticate
      - name: Install doctl
        run: |
          curl -sL https://github.com/digitalocean/doctl/releases/download/v1.99.0/doctl-1.99.0-linux-amd64.tar.gz | tar -xzv
          sudo mv doctl /usr/local/bin/
          doctl version

      - name: Authenticate doctl
        run: doctl auth init -t ${{ env.DO_TOKEN }}

      # ✅ Use cluster ID instead of name (more reliable)
      - name: Get kubeconfig for cluster
        run: |
          doctl kubernetes cluster kubeconfig save 0a03b246-3611-4639-bd54-dc3eeb523a78
          kubectl config current-context
          kubectl get nodes

      # ✅ Deploy to DigitalOcean Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deployment.yml --validate=false
          kubectl apply -f service.yml --validate=false
