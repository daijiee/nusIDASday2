name: End-to-End LLMOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-push-scan-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/nusidasday2:latest
      TRIVY_SEVERITY: ${{ secrets.TRIVY_SEVERITY }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # ---------------- Docker Build & Push ----------------
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: docker build -t $DOCKER_IMAGE .

    - name: Push Docker image
      run: docker push $DOCKER_IMAGE

    # ---------------- Trivy Scan ----------------
    - name: Scan Docker image with Trivy
      uses: aquasecurity/trivy-action@v2
      with:
        image-ref: $DOCKER_IMAGE
        severity-threshold: $TRIVY_SEVERITY

    # ---------------- Deploy to Kubernetes ----------------
    - name: Set up kubeconfig
      run: |
        echo "${{ secrets.KUBECONFIG }}" | base64 --decode > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Deploy to Kubernetes
      run: kubectl apply -f deployment.yml
