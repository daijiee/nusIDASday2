name: LLMOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      KUBECONFIG: ${{ secrets.KUBECONFIG }}
      TRIVY_SEVERITY: ${{ secrets.TRIVY_SEVERITY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_USERNAME/gpt-hf:latest .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_USERNAME }}/gpt-hf:latest
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          scan-type: vuln
        continue-on-error: true

      - name: Push Docker image
        run: |
          docker push $DOCKER_USERNAME/gpt-hf:latest

      - name: Deploy to Kubernetes
        run: |
          echo "$KUBECONFIG" | base64 --decode > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig
          kubectl apply -f service.yml
          kubectl apply -f ingress.yml
